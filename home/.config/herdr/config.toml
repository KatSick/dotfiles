onboarding = false
[theme]
# Matches the One Dark set in zed's settings.json, so both editors and the
# terminal workspace read the same. Herdr's default is catppuccin.
name = "one-dark"

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"

[keys]
prefix = "§"
